<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 700" width="1152" height="700" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Agora debate workflow</title>
  <desc id="d">A question enters question analysis, then opening statements, conflict detection, the Judge's ruling and a convergence check. If the debate has not converged it returns through a cross-examination round to conflict detection. Once converged, the Judge delivers the final verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FDF0C8"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA2FF"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161E4D"/>
      <stop offset="1" stop-color="#0F1536"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1152" height="700" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1150" height="698" rx="27" fill="none" stroke="#FDF0C8" stroke-opacity="0.16"/>

  <text x="40" y="56" fill="#FDF0C8" font-size="26" font-weight="700" font-family="Georgia, 'Times New Roman', serif">How an Agora debate runs</text>
  <text x="40" y="82" fill="#FDF0C8" fill-opacity="0.68" font-size="14">A LangGraph state machine. The Judge never answers until the panel has argued and the debate has converged.</text>

  <g id="main-row" font-size="14" text-anchor="middle">
    <g>
      <rect x="36" y="116" width="150" height="92" rx="16" fill="#2C3B8A" stroke="#FDF0C8" stroke-width="2" filter="url(#glow)"/>
      <text x="111" y="140" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5">1</text>
      <text x="111" y="162" fill="#FDF0C8" font-weight="700">Question analysis</text>
      <text x="111" y="182" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Judge frames the case,</text>
      <text x="111" y="197" fill="#FDF0C8" fill-opacity="0.75" font-size="12">adds a specialist</text>
    </g>
    <g>
      <rect x="222" y="116" width="150" height="92" rx="16" fill="#3A4BA3" stroke="#8FA2FF" stroke-width="2"/>
      <text x="297" y="140" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5">2</text>
      <text x="297" y="162" fill="#FDF0C8" font-weight="700">Opening statements</text>
      <text x="297" y="182" fill="#FDF0C8" fill-opacity="0.75" font-size="12">All debaters argue in</text>
      <text x="297" y="197" fill="#FDF0C8" fill-opacity="0.75" font-size="12">parallel, with sources</text>
    </g>
    <g>
      <rect x="408" y="116" width="150" height="92" rx="16" fill="#2C3B8A" stroke="#FDF0C8" stroke-width="2" filter="url(#glow)"/>
      <text x="483" y="140" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5">3</text>
      <text x="483" y="162" fill="#FDF0C8" font-weight="700">Conflict detection</text>
      <text x="483" y="182" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Judge maps disputes,</text>
      <text x="483" y="197" fill="#FDF0C8" fill-opacity="0.75" font-size="12">sets turn order</text>
    </g>
    <g>
      <rect x="594" y="116" width="150" height="92" rx="16" fill="#2C3B8A" stroke="#FDF0C8" stroke-width="2" filter="url(#glow)"/>
      <text x="669" y="140" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5">4</text>
      <text x="669" y="162" fill="#FDF0C8" font-weight="700">Judge's ruling</text>
      <text x="669" y="182" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Scores, penalties,</text>
      <text x="669" y="197" fill="#FDF0C8" fill-opacity="0.75" font-size="12">rewards, who is right</text>
    </g>
    <g>
      <path d="M855 108 L934 162 L855 216 L776 162 Z" fill="#2C3B8A" stroke="#FDF0C8" stroke-width="2" filter="url(#glow)"/>
      <text x="855" y="146" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5">5</text>
      <text x="855" y="166" fill="#FDF0C8" font-weight="700">Converged?</text>
      <text x="855" y="184" fill="#FDF0C8" fill-opacity="0.75" font-size="11.5">min. rounds met</text>
    </g>
    <g>
      <rect x="966" y="116" width="150" height="92" rx="16" fill="#FDF0C8" stroke="#FDF0C8" stroke-width="2" filter="url(#glow)"/>
      <text x="1041" y="140" fill="#2C3B8A" fill-opacity="0.8" font-size="11" font-weight="700" letter-spacing="1.5">7</text>
      <text x="1041" y="162" fill="#2C3B8A" font-weight="700">Final verdict</text>
      <text x="1041" y="182" fill="#2C3B8A" fill-opacity="0.85" font-size="12">Winners, rejected</text>
      <text x="1041" y="197" fill="#2C3B8A" fill-opacity="0.85" font-size="12">arguments, doubt</text>
    </g>
  </g>

  <g stroke="#FDF0C8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M186 162 H220"/>
    <path d="M372 162 H406"/>
    <path d="M558 162 H592"/>
    <path d="M744 162 H774"/>
    <path d="M934 162 H964"/>
  </g>
  <text x="949" y="146" fill="#A8E0C4" font-size="12" font-weight="700" text-anchor="middle">yes</text>

  <g id="loop">
    <rect x="470" y="292" width="420" height="84" rx="16" fill="#3A4BA3" stroke="#8FA2FF" stroke-width="2"/>
    <text x="680" y="318" fill="#FDF0C8" fill-opacity="0.68" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">6</text>
    <text x="680" y="340" fill="#FDF0C8" font-size="14" font-weight="700" text-anchor="middle">Cross-examination round</text>
    <text x="680" y="360" fill="#FDF0C8" fill-opacity="0.75" font-size="12" text-anchor="middle">Debaters rebut each other in the Judge's order and hold their ground</text>
    <path d="M855 216 V290" stroke="#FDF0C8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="867" y="258" fill="#F4A9B8" font-size="12" font-weight="700">no, another round</text>
    <path d="M470 334 H483 V210" stroke="#FDF0C8" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>
  </g>

  <g id="turn-detail">
    <rect x="36" y="418" width="1080" height="190" rx="20" fill="#0F1536" stroke="#8FA2FF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="60" y="450" fill="#FDF0C8" font-size="15" font-weight="700">Inside every debater turn (steps 2 and 6)</text>
    <path d="M297 208 V418" stroke="#8FA2FF" stroke-width="1.5" stroke-dasharray="3 5" fill="none" marker-end="url(#arrowDim)"/>
    <path d="M680 376 V418" stroke="#8FA2FF" stroke-width="1.5" stroke-dasharray="3 5" fill="none" marker-end="url(#arrowDim)"/>

    <g font-size="13" text-anchor="middle">
      <g>
        <rect x="60" y="468" width="184" height="108" rx="14" fill="#2C3B8A" stroke="#FDF0C8" stroke-opacity="0.25"/>
        <circle cx="84" cy="490" r="11" fill="#8FA2FF"/><text x="84" y="494" fill="#0F1536" font-size="12" font-weight="700">1</text>
        <text x="152" y="520" fill="#FDF0C8" font-weight="700">Plan searches</text>
        <text x="152" y="541" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Agent picks queries that</text>
        <text x="152" y="557" fill="#FDF0C8" fill-opacity="0.75" font-size="12">attack opponents' claims</text>
      </g>
      <g>
        <rect x="262" y="468" width="184" height="108" rx="14" fill="#2C3B8A" stroke="#FDF0C8" stroke-opacity="0.25"/>
        <circle cx="286" cy="490" r="11" fill="#7FD1E8"/><text x="286" y="494" fill="#0F1536" font-size="12" font-weight="700">2</text>
        <text x="354" y="520" fill="#FDF0C8" font-weight="700">Web search</text>
        <text x="354" y="541" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Tavily returns sources.</text>
        <text x="354" y="557" fill="#FDF0C8" fill-opacity="0.75" font-size="12">If it fails: flag unverified</text>
      </g>
      <g>
        <rect x="464" y="468" width="184" height="108" rx="14" fill="#2C3B8A" stroke="#FDF0C8" stroke-opacity="0.25"/>
        <circle cx="488" cy="490" r="11" fill="#B9A7FF"/><text x="488" y="494" fill="#0F1536" font-size="12" font-weight="700">3</text>
        <text x="556" y="520" fill="#FDF0C8" font-weight="700">Argue</text>
        <text x="556" y="541" fill="#FDF0C8" fill-opacity="0.75" font-size="12">70-90 words, cited [E#],</text>
        <text x="556" y="557" fill="#FDF0C8" fill-opacity="0.75" font-size="12">names fallacies, no retreat</text>
      </g>
      <g>
        <rect x="666" y="468" width="184" height="108" rx="14" fill="#2C3B8A" stroke="#F4A9B8" stroke-opacity="0.7" stroke-width="1.5"/>
        <circle cx="690" cy="490" r="11" fill="#F4A9B8"/><text x="690" y="494" fill="#0F1536" font-size="12" font-weight="700">4</text>
        <text x="758" y="520" fill="#FDF0C8" font-weight="700">Confront the Judge</text>
        <text x="758" y="541" fill="#FDF0C8" fill-opacity="0.75" font-size="12">Optional: call out bias or</text>
        <text x="758" y="557" fill="#FDF0C8" fill-opacity="0.75" font-size="12">an unfair score</text>
      </g>
      <g>
        <rect x="868" y="468" width="228" height="108" rx="14" fill="#FDF0C8"/>
        <circle cx="892" cy="490" r="11" fill="#2C3B8A"/><text x="892" y="494" fill="#FDF0C8" font-size="12" font-weight="700">5</text>
        <text x="982" y="520" fill="#2C3B8A" font-weight="700">Judge answers at once</text>
        <text x="982" y="541" fill="#2C3B8A" fill-opacity="0.85" font-size="12">upheld, partly or rejected,</text>
        <text x="982" y="557" fill="#2C3B8A" fill-opacity="0.85" font-size="12">with a score change</text>
      </g>
    </g>
    <g stroke="#FDF0C8" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M244 522 H260"/>
      <path d="M446 522 H462"/>
      <path d="M648 522 H664"/>
      <path d="M850 522 H866"/>
    </g>
  </g>

  <g font-size="12" fill="#FDF0C8">
    <rect x="40" y="636" width="16" height="16" rx="4" fill="#2C3B8A" stroke="#FDF0C8" stroke-width="2"/>
    <text x="64" y="649">Judge steps</text>
    <rect x="156" y="636" width="16" height="16" rx="4" fill="#3A4BA3" stroke="#8FA2FF" stroke-width="2"/>
    <text x="180" y="649">Debater steps</text>
    <rect x="286" y="636" width="16" height="16" rx="4" fill="#FDF0C8"/>
    <text x="310" y="649">Outcome</text>
    <text x="1112" y="649" text-anchor="end" fill-opacity="0.68">Every step is stored as an event, streamed live over WebSocket, and replayed on reconnect.</text>
  </g>
</svg>
